name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const manifest=require("./manifest.json"); if (manifest.version !== process.env.RELEASE_TAG) { console.error(`Tag ${process.env.RELEASE_TAG} does not match manifest ${manifest.version}`); process.exit(1) }'
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" main.js manifest.json styles.css --title "${{ github.ref_name }}" --generate-notes
